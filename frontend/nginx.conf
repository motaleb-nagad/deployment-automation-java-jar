# nginx serves the built SPA and reverse-proxies the API to the backend service.
# ${BACKEND_URL} is substituted from the container env at startup (nginx templates).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API + SSE. proxy_buffering off is essential so deploy output streams live.
    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location /actuator/ {
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $host;
    }

    # SPA fallback — client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
