spring:
  application:
    name: nagad-deploy-console
  # Default profile runs against Postgres. Activate the "dev" profile to use
  # an in-memory H2 database so the service boots with no external dependency.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/registrydb}
    username: ${DB_USER:registry}
    password: ${DB_PASSWORD:registry}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    # Allow a lower-versioned migration to apply after higher ones already ran. The versioned
    # migrations are split across folders (db/migration holds the low numbers, db/migration-pg
    # holds V10), so a newly added migration like V4 can land in an existing database whose
    # history already includes V10. Without this, Flyway aborts on startup with
    # "Detected resolved migration not applied to database" and the backend crash-loops.
    out-of-order: true
    locations: classpath:db/migration,classpath:db/migration-pg

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true   # exposes /actuator/health/liveness and /readiness for k8s

nagad:
  # Where the Ansible wrapper lives on the jump host. Deploy/fetch jobs shell
  # out to this from a worker thread — never inline on the request thread.
  ansible:
    working-dir: ${ANSIBLE_DIR:/home/konasl/motaleb-ansible/stop-deploy-start}
    # Portal-UI channel wrapper lives in its own package (fetch/deploy/rollback/verify
    # of the DMZ portal UIs). Its run.sh is invoked from this directory on the jump host.
    portal-ui:
      working-dir: ${PORTAL_UI_DIR:/home/konasl/motaleb-ansible/portalui-deployment}
    # In demo mode the runner streams scripted output instead of invoking ansible.
    simulate: ${ANSIBLE_SIMULATE:true}
    # Real runs SSH into the jump host as the ansible operator and invoke ./run.sh there,
    # reusing that account's ansible install, inventory and SSH keys. Only used when
    # simulate=false. host.docker.internal resolves to the container host (needs the
    # extra_hosts host-gateway mapping in compose).
    ssh:
      host: ${ANSIBLE_SSH_HOST:host.docker.internal}
      port: ${ANSIBLE_SSH_PORT:40167}
      user: ${ANSIBLE_SSH_USER:konasl}
      key: ${ANSIBLE_SSH_KEY:/run/secrets/deploy_key}
      strict-host-key-checking: ${ANSIBLE_SSH_STRICT:false}
    # Real fleet status. The backend only calls this script — it lives in the ansible
    # package (the working-dir above) and owns all status-gathering logic and prod-load
    # tuning. ttl-seconds bounds how often the portal may sweep prod (on-demand + cached).
    fleet:
      command: ${FLEET_STATUS_CMD:./fleet-status.sh}
      timeout-seconds: ${FLEET_TIMEOUT:60}
      ttl-seconds: ${FLEET_TTL:180}
  # Post-action process verification. After a stop/start run the console independently reads the
  # live process table on each target host (ps -u <service-user> for the app's jar) and confirms
  # the service actually reached the expected state — Ansible's "started" only means the start
  # command fired, which is not the same as a slow JVM being up. Read-only: it never restarts,
  # kills or rolls anything back; a bad result is flagged as an INCIDENT for a human to act on.
  verify:
    enabled: ${VERIFY_ENABLED:true}
    # How long to keep re-checking before giving up. The poll settles as soon as a service reaches
    # the expected state, so a fast service never waits the full window — this is only the ceiling
    # before a still-down service is declared not-running. Give start plenty of headroom for a
    # slow JVM to bind; raise it further for the heaviest services. interval is the gap between reads.
    start-timeout-seconds: ${VERIFY_START_TIMEOUT:180}
    stop-timeout-seconds: ${VERIFY_STOP_TIMEOUT:45}
    interval-seconds: ${VERIFY_INTERVAL:6}
  mail:
    relay: ${MAIL_RELAY:10.210.2.16:25}
    from: no-reply@nagad.com.bd
    # In demo mode OTP + approval mails are logged, not sent.
    simulate: ${MAIL_SIMULATE:true}
  otp:
    ttl-seconds: 300
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}

logging:
  level:
    com.nagad.deploy: INFO

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:registrydb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  flyway:
    locations: classpath:db/migration,classpath:db/migration-h2
