# Production stack: pulls pre-built images from Docker Hub.
#   docker compose -f docker-compose.prod.yml up -d
services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-registrydb}
      POSTGRES_USER: ${POSTGRES_USER:-registry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-registry}
    privileged: true
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U registry -d registrydb"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    image: bhuiyanshakil/deployment-automation-backend:latest
    restart: always
    privileged: true
    depends_on:
      db:
        condition: service_healthy
    # host.docker.internal -> the container host, so the backend can SSH to the jump
    # host and invoke ./run.sh with the operator's ansible environment.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Private key authorised for the ansible operator (konasl) on the jump host.
      # Place it on the host and keep it readable by the container user (uid 1000).
      - ./secrets/deploy_key:/run/secrets/deploy_key:ro
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-registrydb}
      DB_USER: ${POSTGRES_USER:-registry}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-registry}
      # Migrations are split across folders (db/migration = low numbers, db/migration-pg = V10),
      # so a newly added lower-numbered migration must be allowed to apply after V10 on an
      # existing database. Without this, Flyway aborts startup and the backend crash-loops.
      # Baked into application.yml too; kept here so pre-built images pick it up on restart.
      SPRING_FLYWAY_OUT_OF_ORDER: "true"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://10.220.2.46:8088}
      MAIL_SIMULATE: ${MAIL_SIMULATE:-true}
      # Real deploys by default now: SSH to the jump host and run ./run.sh.
      # Set ANSIBLE_SIMULATE=true to fall back to scripted demo output.
      ANSIBLE_SIMULATE: ${ANSIBLE_SIMULATE:-false}
      ANSIBLE_SSH_HOST: ${ANSIBLE_SSH_HOST:-host.docker.internal}
      ANSIBLE_SSH_PORT: ${ANSIBLE_SSH_PORT:-40167}
      ANSIBLE_SSH_USER: ${ANSIBLE_SSH_USER:-konasl}
      ANSIBLE_SSH_KEY: /run/secrets/deploy_key
      ANSIBLE_DIR: ${ANSIBLE_DIR:-/home/konasl/motaleb-ansible/stop-deploy-start}
      # Staging deployment bundle: uploaded jars/configs/UI tarballs are staged here, then
      # ./run.sh (and portalui/run.sh) run from this directory on the jump host.
      STG_DIR: ${STG_DIR:-/home/konasl/motaleb-ansible/stg-deployment}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20

  frontend:
    image: bhuiyanshakil/deployment-automation-frontend:latest
    restart: always
    privileged: true
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "8088:8080"

volumes:
  db-data:
